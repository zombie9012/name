<!DOCTYPE html>
<html>
<head>
    <title>Stonecutters</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 100px;
            background: #69;
            color: white;
        }

        button {
            padding: 15px 25px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Stonecutters</h1>

    <p id="song">Click the button.</p>

    <button onclick="newSong()">Is Stonecutters a cool song?</button>

    <script>
        const songs = [
            "Yes.",
            "Hell yes.",
            "Fuck yes.",
            "Hell yeahahhh.",
            "stop clicking me",
            "STOP"
        ];

        function newSong() {
            const randomNumber = Math.floor(Math.random() * songs.length);

            document.getElementById("song").textContent =
                songs[randomNumber];
        }
    </script>

</body>
</html>
