<!DOCTYPE html>
<html>
<head>
    <title>TIS COOL SONG YAY OR YES</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 100px;
            background: #7DDB70;
            color: black;
        }

        .stonecutters {
            padding: 15px 25px;
            font-size: 18px;
            cursor: pointer;
        }

        .sleepwalking {
            padding: 15px 15px;
            font-size: 12px;
            cursor: pointer;

        }
    </style>
</head>

<body>

    <h1>Cool song?</h1>

    <p id="answer">Click the button. OR ELSE</p>

    <button class="stonecutters" onclick="newAnswer()">Is Stonecutters a cool song?</button>
    
    <button class="sleepwalking" onclick="newAnswer()">Is Sleepwalking a cool song?</button>    

    <script>
        const answers = [
            "Yes.",
            "Hell yes.",
            "Fuck yes.",
            "Hell yeahahhh.",
    
        ];
    let answerNumber = 0
function newAnswer() {
    document.getElementById("answer").textContent =
        answers[answerNumber];

    answerNumber++;
}
        }
    </script>

</body>
</html>
